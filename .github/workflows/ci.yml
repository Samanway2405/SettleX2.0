name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public placeholders for CI only. Real values are injected in deployment environments.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Lint Supabase SQL (search_path mutable & security checks)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = ['supabase-setup.sql'];
            const migDir = 'supabase/migrations';
            if (fs.existsSync(migDir)) {
              for (const f of fs.readdirSync(migDir)) {
                if (f.endsWith('.sql')) files.push(path.join(migDir, f));
              }
            }
            let errors = 0;
            for (const file of files) {
              const sql = fs.readFileSync(file, 'utf8');
              const funcs = sql.split(/CREATE OR REPLACE FUNCTION/i).slice(1);
              for (const chunk of funcs) {
                const header = chunk.split(/\$\$|\$body\$/i)[0];
                const nameMatch = header.match(/^\s*([a-zA-Z0-9_\.]+)/);
                const funcName = nameMatch ? nameMatch[1] : 'unknown';
                if (!/search_path\s*=/i.test(header)) {
                  console.error('ERROR in ' + file + ': Function ' + funcName + ' is missing SET search_path');
                  errors++;
                }
              }
            }
            if (errors > 0) {
              console.error('Failed Supabase DB function search_path lint with ' + errors + ' errors.');
              process.exit(1);
            }
            console.log('Passed Supabase DB function search_path lint across ' + files.length + ' files.');
          "

      - name: Validate Supabase SQL Syntax
        run: |
          docker run --name pg-lint -e POSTGRES_PASSWORD=postgres -d postgres:16 -c wal_level=logical
          trap 'docker rm -f pg-lint >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if docker exec pg-lint pg_isready -U postgres; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "PostgreSQL did not become ready within 60 seconds."
              exit 1
            fi
            sleep 1
          done
          docker exec -i pg-lint psql -U postgres -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role; CREATE PUBLICATION supabase_realtime;"
          echo "Validating supabase-setup.sql..."
          docker exec -i pg-lint psql -U postgres -v ON_ERROR_STOP=1 -f - < supabase-setup.sql
          echo "Validating versioned migrations on clean database..."
          docker exec -i pg-lint psql -U postgres -c "CREATE DATABASE settlex_migrations; GRANT ALL ON DATABASE settlex_migrations TO postgres;"
          docker exec -i pg-lint psql -U postgres -d settlex_migrations -c "CREATE PUBLICATION supabase_realtime;"
          for mig in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $mig"
            docker exec -i pg-lint psql -U postgres -d settlex_migrations -v ON_ERROR_STOP=1 -f - < "$mig"
          done

      - name: Test with coverage gate
        run: npm run test:coverage -- --runInBand

      - name: Build
        run: npm run build

  rust-contract:
    name: Rust Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version 26.1.0

      - name: Run contract tests
        working-directory: contract
        run: cargo test

      - name: Build contract for WASM
        run: stellar contract build --manifest-path contract/Cargo.toml

      - name: Check WASM size
        run: |
          WASM_FILE=$(find contract/target -name "*.wasm" | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "Error: WASM file not found!"
            exit 1
          fi
          SIZE=$(stat -c%s "$WASM_FILE")
          MAX_SIZE=131072
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: WASM size exceeds the deployment size limit of $MAX_SIZE bytes."
            exit 1
          fi
